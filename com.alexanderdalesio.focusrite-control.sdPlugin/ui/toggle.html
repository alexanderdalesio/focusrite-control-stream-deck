<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toggle Control</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <p class="hint">Enter a boolean control name shown by <code>focusrite list</code>, such as <code>input1-mute</code>.</p>
  <sdpi-item label="Control">
    <sdpi-textfield setting="control" default="dim" placeholder="dim"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="API address">
    <sdpi-textfield setting="apiUrl" default="http://127.0.0.1:41780"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
