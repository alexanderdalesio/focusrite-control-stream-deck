<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focusrite API</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <p class="hint">The Focusrite API service must be running. The default address works with <code>focusrite api</code> and <code>focusrite service install</code>.</p>
  <sdpi-item label="API address">
    <sdpi-textfield setting="apiUrl" default="http://127.0.0.1:41780" placeholder="http://127.0.0.1:41780"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
