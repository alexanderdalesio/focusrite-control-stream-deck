<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Input Control</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <p class="hint">Choose the analogue input controlled by this key.</p>
  <sdpi-item label="Input">
    <sdpi-select setting="input" default="1">
      <option value="1">Input 1</option>
      <option value="2">Input 2</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="API address">
    <sdpi-textfield setting="apiUrl" default="http://127.0.0.1:41780"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
