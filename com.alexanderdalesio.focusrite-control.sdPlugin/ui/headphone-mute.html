<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Headphone Mute</title><link rel="stylesheet" href="style.css"><script defer src="common.js"></script></head><body>
<p class="hint">Choose any headphone output reported by the selected API and the channel this key mutes.</p>
<label class="field"><span>Output</span><select data-setting="headphone" data-default="1" data-headphone-feature="mute"></select></label>
<label class="field"><span>Channel</span><select data-setting="side" data-default="l"><option value="l">Left</option><option value="r">Right</option></select></label>
</body></html>
