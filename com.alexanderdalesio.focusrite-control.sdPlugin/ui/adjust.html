<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Adjust Level</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <p class="hint">Use a Stream Deck + dial, or press a key once per step. Use a negative step for a decrease key.</p>
  <sdpi-item label="Control">
    <sdpi-textfield setting="control" default="monitor-gain" placeholder="monitor-gain"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Step">
    <sdpi-textfield setting="step" default="1" inputmode="decimal" placeholder="1"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="API address">
    <sdpi-textfield setting="apiUrl" default="http://127.0.0.1:41780"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
