<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Adjust Level</title><link rel="stylesheet" href="style.css"><script defer src="common.js"></script></head><body>
<p class="hint">Turn a dial or press a key once per step. A negative step creates a decrease key.</p>
<label class="field"><span>Control</span><select data-setting="control" data-default="monitor-gain" data-control-kind="integer|gain"></select></label>
<label class="field"><span>Step</span><input data-setting="step" data-default="1" inputmode="decimal"></label>
</body></html>
