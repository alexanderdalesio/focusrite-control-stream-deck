<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Headphone Level</title><link rel="stylesheet" href="style.css"><script defer src="common.js"></script></head><body>
<p class="hint">Choose any headphone output reported by the selected API, then its channel and adjustment step.</p>
<label class="field"><span>Output</span><select data-setting="headphone" data-default="1" data-headphone-feature="level"></select></label>
<label class="field"><span>Channel</span><select data-setting="side" data-default="l"><option value="l">Left</option><option value="r">Right</option></select></label>
<label class="field"><span>Step</span><input data-setting="step" data-default="1" inputmode="decimal"></label>
</body></html>
